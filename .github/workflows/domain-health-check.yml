name: TANEM domain health check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-health-check.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS, DNSSEC and TLS
        shell: bash
        run: |
          set +e
          for name in maria.tanem.ru lyudmila-nekora.tanem.ru; do
            echo "=== HOST $name ==="
            dig "$name" CNAME +noall +answer +comments
            dig @8.8.8.8 "$name" CNAME +noall +answer +comments
            dig @1.1.1.1 "$name" CNAME +noall +answer +comments
            echo "--- HTTP ---"
            curl -sS -I --max-time 15 "http://$name/" | head -20
            echo "--- HTTPS ---"
            curl -sS -I --max-time 15 "https://$name/" | head -20
            echo "--- TLS peer ---"
            echo | openssl s_client -connect "$name:443" -servername "$name" -brief 2>&1 | head -30
          done
          echo "=== TANEM ZONE ==="
          dig tanem.ru NS +noall +answer +comments
          dig tanem.ru DS +dnssec +noall +answer +authority +comments
          dig @8.8.8.8 tanem.ru DS +dnssec +noall +answer +authority +comments
          dig @1.1.1.1 tanem.ru DS +dnssec +noall +answer +authority +comments
          dig tanem.ru DNSKEY +dnssec +noall +answer +authority +comments
          dig tanem.ru CAA +noall +answer +authority +comments
          dig _github-pages-challenge-ichAEY.tanem.ru TXT +noall +answer +authority +comments
          for ns in $(dig tanem.ru NS +short); do
            echo "=== AUTH $ns ==="
            dig @"$ns" maria.tanem.ru CNAME +noall +answer +authority +comments
            dig @"$ns" lyudmila-nekora.tanem.ru CNAME +noall +answer +authority +comments
            dig @"$ns" _github-pages-challenge-ichAEY.tanem.ru TXT +noall +answer +authority +comments
          done
