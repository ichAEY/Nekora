name: Nekora quality and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # Temporary: commit the repaired portfolio files back to this repository.
  pages: write
  id-token: write

concurrency:
  group: nekora-pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair images 2-6 that contain HEIC/JPEG instead of real WebP
        shell: bash
        run: |
          set -euo pipefail
          gallery=public/assets/lyudmila/portfolio
          broken=()
          for n in 02 03 04 05 06; do
            photo="$gallery/galery000$n.webp"
            test -s "$photo"
            mime="$(file --mime-type --brief "$photo")"
            echo "Portfolio $n: $mime"
            if [ "$mime" != "image/webp" ]; then
              broken+=("$photo")
            fi
          done
          if [ "${#broken[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265 webp
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            for photo in "${broken[@]}"; do
              mime="$(file --mime-type --brief "$photo")"
              case "$mime" in
                image/heic|image/heif|application/octet-stream)
                  cp "$photo" "$tmp/source.heic"
                  heif-convert "$tmp/source.heic" "$tmp/source.png"
                  test -s "$tmp/source.png"
                  input="$tmp/source.png"
                  ;;
                image/jpeg|image/png)
                  input="$photo"
                  ;;
                *)
                  echo "::error::Cannot convert $photo: unexpected type $mime"
                  exit 1
                  ;;
              esac
              cwebp -quiet -q 88 "$input" -o "$tmp/repaired.webp"
              test -s "$tmp/repaired.webp"
              mv "$tmp/repaired.webp" "$photo"
              rm -f "$tmp/source.heic" "$tmp/source.png"
              echo "Converted $photo -> $(file --mime-type --brief "$photo")"
            done
          fi
          python3 - <<'PY'
          from pathlib import Path
          for n in range(2, 7):
              p = Path(f"public/assets/lyudmila/portfolio/galery{n:05d}.webp")
              raw = p.read_bytes()[:12]
              assert raw[:4] == b"RIFF" and raw[8:12] == b"WEBP", f"Not real WebP: {p}"
              print(f"Validated WebP: {p}")
          PY
      - name: Select GitHub preview as default build target
        run: node scripts/resolve-pages-target.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Require GitHub Pages and read the configured custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! pages_json="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1)"; then
            echo "::error::GitHub Pages is disabled or inaccessible. Open Settings > Pages and choose Source: GitHub Actions. No deployment has happened."
            printf '%s\n' "$pages_json"
            exit 1
          fi
          custom_domain="$(printf '%s' "$pages_json" | jq -r '.cname // empty')"
          echo "PAGES_CUSTOM_DOMAIN=$custom_domain" >> "$GITHUB_ENV"
          if [ -n "$custom_domain" ]; then
            echo "Pages custom domain configured: $custom_domain"
          else
            echo "::notice::No custom domain yet: building the GitHub preview URL."
          fi
      - name: Switch to root-relative assets when a custom domain exists
        if: env.PAGES_CUSTOM_DOMAIN != ''
        run: node scripts/resolve-pages-target.mjs
      - name: Rebuild only when publishing at a custom domain
        if: env.PAGES_CUSTOM_DOMAIN != ''
        run: npm run build
      - name: Validate the published export, canonical URL and local images
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/assets/lyudmila/master.webp
          test -s out/assets/lyudmila/masterpc.webp
          test -s out/assets/lyudmila/shablonLED.webp
          for img in public/assets/lyudmila/portfolio/*.webp; do
            test -s "out/assets/lyudmila/portfolio/${img##*/}"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('out/index.html', 'utf8');
          const canonical = process.env.NEXT_PUBLIC_SITE_URL;
          const base = process.env.NEXT_PUBLIC_BASE_PATH || '';
          if (!canonical || !html.includes(canonical)) throw new Error('Canonical URL does not match target');
          if (base && !html.includes(base + '/_next/')) throw new Error('Preview scripts lost the repository prefix');
          if (!base && html.includes('"/Nekora/_next/')) throw new Error('Custom-domain scripts still use the preview prefix');
          NODE
          cp out/index.html out/404.html
          touch out/.nojekyll

      - name: Save repaired portfolio originals after successful export validation
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/assets/lyudmila/portfolio/galery0000{2,3,4,5,6}.webp
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Fix mismatched HEIC portfolio photos 2-6: genuine WebP"
            git push origin HEAD:main
          else
            echo "Gallery photos already have correct file signatures."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
