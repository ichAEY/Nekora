name: Temporary TXT check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/txt-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          host="_github-pages-challenge-ichAEY.tanem.ru"
          echo "DEFAULT"
          dig "$host" TXT +noall +answer +authority +comments
          echo "GOOGLE"
          dig @8.8.8.8 "$host" TXT +noall +answer +authority +comments
          echo "CLOUDFLARE"
          dig @1.1.1.1 "$host" TXT +noall +answer +authority +comments
          echo "NS1"
          dig @ns1.reg.ru "$host" TXT +noall +answer +authority +comments
          echo "NS2"
          dig @ns2.reg.ru "$host" TXT +noall +answer +authority +comments
