name: Temporary certificate diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cert-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent public certificates for tanem.ru
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, datetime
          url = "https://crt.sh/?q=%25.tanem.ru&output=json"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
          except Exception as e:
              print("CRT_FETCH_ERROR", repr(e))
              raise SystemExit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(days=7)
          recent = []
          for row in data:
              raw = row.get("not_before") or row.get("entry_timestamp")
              if not raw:
                  continue
              try:
                  dt = datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=datetime.timezone.utc)
              except Exception:
                  continue
              if dt >= cutoff:
                  recent.append(row)
          # Deduplicate by serial_number when present, else id.
          uniq = {}
          for row in recent:
              key = row.get("serial_number") or row.get("id")
              uniq[str(key)] = row
          le = []
          for row in uniq.values():
              issuer = (row.get("issuer_name") or "").lower()
              if "let's encrypt" in issuer or "lets encrypt" in issuer:
                  le.append(row)
          print("TOTAL_ROWS", len(data))
          print("UNIQUE_CERTS_LAST_7_DAYS", len(uniq))
          print("LETS_ENCRYPT_UNIQUE_LAST_7_DAYS", len(le))
          print("=== NEWEST 25 CERTIFICATE ROWS ===")
          for row in sorted(data, key=lambda x: x.get("not_before",""), reverse=True)[:25]:
              print("NEWEST", row.get("not_before"), row.get("name_value"), row.get("issuer_name"), row.get("serial_number"))
          PY
